<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 900" font-family="IBM Plex Sans, Arial, sans-serif">
  <style>
    .box{fill:#eef7f5;stroke:#0f766e;stroke-width:2;rx:10;}
    .label{fill:#161b1a;font-size:20px;font-weight:700;text-anchor:middle;}
    .sub{fill:#5b6564;font-size:12px;text-anchor:middle;}
    .arrow{stroke:#5b6564;stroke-width:2;marker-end:url(#head);}
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5b6564"/>
    </marker>
  </defs>
  <rect width="480" height="900" fill="#ffffff"/>

  <!-- BENH NHAN -->
  <rect class="box" x="90" y="20" width="300" height="70" rx="10"/>
  <text class="label" x="240" y="62">BỆNH NHÂN</text>
  <line class="arrow" x1="240" y1="90" x2="240" y2="130"/>

  <!-- CAM BIEN -->
  <rect class="box" x="90" y="132" width="300" height="80" rx="10"/>
  <text class="label" x="240" y="168">CẢM BIẾN</text>
  <text class="sub" x="240" y="188">MAX30102 · HX711+Load Cell · Drop Sensor</text>
  <line class="arrow" x1="240" y1="212" x2="240" y2="252"/>

  <!-- xG26 + EDGE AI -->
  <rect class="box" x="90" y="254" width="300" height="80" rx="10"/>
  <text class="label" x="240" y="290">xG26 + EDGE AI</text>
  <text class="sub" x="240" y="310">1D-CNN · TensorFlow Lite Micro</text>
  <line class="arrow" x1="240" y1="334" x2="240" y2="374"/>

  <!-- ZIGBEE -->
  <rect class="box" x="90" y="376" width="300" height="70" rx="10"/>
  <text class="label" x="240" y="418">ZIGBEE</text>
  <line class="arrow" x1="240" y1="446" x2="240" y2="486"/>

  <!-- RASPBERRY PI -->
  <rect class="box" x="90" y="488" width="300" height="70" rx="10"/>
  <text class="label" x="240" y="530">RASPBERRY PI</text>
  <line class="arrow" x1="240" y1="558" x2="240" y2="598"/>

  <!-- HIS SERVER -->
  <rect class="box" x="90" y="600" width="300" height="70" rx="10"/>
  <text class="label" x="240" y="642">HIS SERVER</text>
  <line class="arrow" x1="240" y1="670" x2="240" y2="710"/>

  <!-- DIEU DUONG -->
  <rect class="box" x="90" y="712" width="300" height="70" rx="10"/>
  <text class="label" x="240" y="754">ĐIỀU DƯỠNG</text>

  <text class="sub" x="240" y="820" font-size="13">Sơ đồ 📊 dựng tay — kiến trúc đúng theo</text>
  <text class="sub" x="240" y="838" font-size="13">gateway/main.c &amp; server/src/HisServer</text>
</svg>
