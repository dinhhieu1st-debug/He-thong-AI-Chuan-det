<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="IBM Plex Sans, Arial, sans-serif">
  <style>
    .box{fill:#eef7f5;stroke:#0f766e;stroke-width:2;}
    .label{fill:#161b1a;font-size:16px;font-weight:700;text-anchor:middle;}
    .sub{fill:#5b6564;font-size:11.5px;text-anchor:middle;}
    .arrow{stroke:#5b6564;stroke-width:2;marker-end:url(#head5);}
    .rowlabel{fill:#0f766e;font-size:12.5px;font-weight:700;}
  </style>
  <defs>
    <marker id="head5" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5b6564"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#ffffff"/>

  <text x="30" y="34" class="rowlabel">MODEL 1 — Drip forecaster (1D-CNN)</text>
  <rect class="box" x="30" y="46" width="170" height="60" rx="8"/>
  <text class="label" x="115" y="80" font-size="14">64s tỉ lệ giọt</text>
  <line class="arrow" x1="202" y1="76" x2="248" y2="76"/>
  <rect class="box" x="252" y="46" width="130" height="60" rx="8"/>
  <text class="label" x="317" y="80" font-size="14">1D-CNN</text>
  <line class="arrow" x1="384" y1="76" x2="430" y2="76"/>
  <rect class="box" x="434" y="46" width="170" height="60" rx="8"/>
  <text class="label" x="519" y="80" font-size="14">dự báo 16s</text>

  <text x="30" y="144" class="rowlabel">MODEL 2 — Vitals forecaster (1D-CNN)</text>
  <rect class="box" x="30" y="156" width="170" height="60" rx="8"/>
  <text class="label" x="115" y="184" font-size="13">64s HR + SpO₂</text>
  <line class="arrow" x1="202" y1="186" x2="248" y2="186"/>
  <rect class="box" x="252" y="156" width="130" height="60" rx="8"/>
  <text class="label" x="317" y="190" font-size="14">1D-CNN</text>
  <line class="arrow" x1="384" y1="186" x2="430" y2="186"/>
  <rect class="box" x="434" y="156" width="170" height="60" rx="8"/>
  <text class="label" x="519" y="184" font-size="13">dự báo 16s</text>

  <text x="30" y="254" class="rowlabel">MODEL 3 — Vitals autoencoder (khác hẳn 2 model trên)</text>
  <rect class="box" x="30" y="266" width="220" height="60" rx="8"/>
  <text class="label" x="140" y="292" font-size="13">1 snapshot tức thời</text>
  <text class="sub" x="140" y="310">(độ lệch HR + SpO₂ hiện tại — KHÔNG dùng cửa sổ 64s)</text>
  <line class="arrow" x1="252" y1="296" x2="298" y2="296"/>
  <rect class="box" x="302" y="266" width="130" height="60" rx="8"/>
  <text class="label" x="367" y="300" font-size="13">autoencoder</text>
  <line class="arrow" x1="434" y1="296" x2="480" y2="296"/>
  <rect class="box" x="484" y="266" width="220" height="60" rx="8"/>
  <text class="label" x="594" y="292" font-size="13">điểm bất thường</text>
  <text class="sub" x="594" y="310">so với ngưỡng đo được</text>

  <rect x="640" y="46" width="250" height="170" rx="8" fill="#f4f6f5" stroke="#d7dcdc"/>
  <text x="660" y="70" font-size="12.5" font-weight="700" fill="#161b1a">3 interpreter, 3 arena riêng</text>
  <foreignObject x="655" y="80" width="220" height="125">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'IBM Plex Sans',Arial,sans-serif;font-size:11.5px;color:#5b6564;line-height:1.5;">Cố ý tách riêng: một model lỗi không kéo sập hai model kia. Xem firmware/ai_engine.h.</div>
  </foreignObject>

  <text x="460" y="380" text-anchor="middle" font-size="12.5" fill="#5b6564">Nguồn: firmware/ai_engine.h (AI_WINDOW=64, AI_HORIZON=16) · firmware/ai_fusion.c</text>
  <text x="460" y="400" text-anchor="middle" font-size="12" fill="#5b6564">Sơ đồ 📊 dựng tay, không AI</text>
</svg>
