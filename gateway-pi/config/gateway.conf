# Dia chi HIS server. De 127.0.0.1 khi gateway va server chay cung may.
# Khi chuyen sang Raspberry Pi, doi thanh IP LAN cua may chay HIS server.
HIS_SERVER_HOST=127.0.0.1
HIS_SERVER_PORT=5000

# Mosquitto va Zigbee2MQTT thuong chay ngay tren gateway.
MQTT_HOST=127.0.0.1
MQTT_PORT=1885
Z2M_BASE_TOPIC=zigbee2mqtt

# Thong tin giuong gui kem moi ban tin.
BED_ID=BED-01
BED_ROOM=Unknown room

# EUI64 cua thiet bi XG26 dang phuc vu giuong nay.
ZIGBEE_DEVICE_ID=0x64028ffffe641802
