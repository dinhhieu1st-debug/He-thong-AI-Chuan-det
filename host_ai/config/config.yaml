project:
  name: IV_Drip_EarlyWarning_AI

serial:
  baudrate: 115200

firmware:
  target_interval_ms: 1000

infusion_presets:
  # Research presets for this prototype, not universal clinical prescriptions.
  slow:
    target_interval_ms: 1500
    target_drops_per_minute: 40
  normal:
    target_interval_ms: 1000
    target_drops_per_minute: 60
  fast:
    target_interval_ms: 750
    target_drops_per_minute: 80

dataset:
  stable_ratio_min: 0.90
  stable_ratio_max: 1.10
  sequence_length: 20
  future_horizon: 5
  split_unit: session
  drop_factor_gtt_per_ml: null
  drop_factor_note: Read this value from the IV tubing package before converting to mL/hour.

synthetic_dataset:
  generator_version: synthetic_v1
  seed: 20260813
  sessions: 240
  records_per_session: 180
  scenarios_per_preset: 8
  sessions_per_scenario: 10
  research_only: true

label_policy:
  version: future_state_v1_prototype
  research_only: true
  future_horizon: 5
  normal:
    class: 1
    rule: all future ratios are within 0.90 to 1.10
  attention:
    class: 2
    rule: moderate deviation or transition not meeting class 1 or class 3
  warning:
    class: 3
    rule: future max ratio >= 2.0 or future mean ratio <= 0.75 or >= 1.30

ai:
  classes:
    1: normal
    2: attention
    3: warning
  status: mlp_and_lstm_trained
  baseline_model: models/mlp_baseline/model.joblib
  baseline_test_accuracy: 0.9196047008547008
  baseline_test_warning_recall: 0.9147344801795063
  sequence_model: models/lstm/model.onnx
  lstm_test_accuracy: 0.9111912393162394
  lstm_test_warning_recall: 0.9080029917726253
  pi_demo_mode: shadow_compare_mlp_and_lstm
  pi_demo_host: 192.168.137.227
  pi_demo_path: /home/pi/iv_drip_ai
  pi_replay_self_test: pass
  pi_live_serial_test: pending_hardware_connection
  deployment_ready: false
