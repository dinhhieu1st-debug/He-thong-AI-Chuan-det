<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · HIS Server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232470c8'/%3E%3Crect x='4' y='11' width='16' height='7' rx='1.3' fill='white'/%3E%3Cpath d='M4 11V9a2 2 0 0 1 2-2h4' stroke='white' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<style>
  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef2f7;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #dbe3ec;
    box-shadow: 0 10px 30px rgba(16, 36, 63, .10);
    padding: 28px 26px;
  }
  .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .login-brand .brand-icon {
    width: 34px; height: 34px; border-radius: 8px; background: #2470c8;
    display: flex; align-items: center; justify-content: center;
  }
  .login-title { font-size: 17px; font-weight: 700; color: #10243f; }
  .login-sub { font-size: 12px; color: #6b7f99; }
  .login-field { margin-bottom: 14px; }
  .login-field label {
    display: block; font-size: 12px; font-weight: 600;
    color: #43566f; margin-bottom: 5px;
  }
  .login-field input {
    width: 100%; padding: 9px 11px; font-size: 14px;
    border: 1px solid #cfd9e5; border-radius: 7px; background: #fbfcfe;
  }
  .login-field input:focus { outline: none; border-color: #2470c8; background: #fff; }
  .login-card .btn.primary { width: 100%; justify-content: center; padding: 10px; font-size: 14px; }
  .login-error {
    display: none; margin-bottom: 14px; padding: 9px 11px;
    background: #fdecec; border: 1px solid #f3c3c3; border-radius: 7px;
    color: #b3261e; font-size: 13px;
  }
  .login-hint { margin-top: 16px; font-size: 11.5px; color: #8496ad; line-height: 1.5; }
</style>
</head>
<body>
<div class="login-page">
  <form class="login-card" id="loginForm">
    <div class="login-brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="8" rx="1.5"></rect><path d="M3 11v-2a2 2 0 0 1 2-2h5"></path><circle cx="7.5" cy="8.5" r="1"></circle></svg>
      </div>
      <div>
        <div class="login-title">HIS Server</div>
        <div class="login-sub">IV infusion monitoring</div>
      </div>
    </div>

    <div class="login-error" id="loginError"></div>

    <div class="login-field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>

    <div class="login-field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn primary" id="loginBtn">Sign in</button>

    <div class="login-hint">
      Accounts are issued by an administrator. If you forget your password, ask
      them to reset it — there is no recovery email.
    </div>
  </form>
</div>
<script src="js/login.js"></script>
</body>
</html>
