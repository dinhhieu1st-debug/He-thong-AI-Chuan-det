<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · HIS Server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232470c8'/%3E%3Crect x='4' y='11' width='16' height='7' rx='1.3' fill='white'/%3E%3Cpath d='M4 11V9a2 2 0 0 1 2-2h4' stroke='white' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<script>
  // Same FOUC guard as index.html - see that file's comment.
  (function () {
    var saved = localStorage.getItem("theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  })();
</script>
<link rel="stylesheet" href="css/app.css">
<style>
  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 24px;
    position: relative;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    color: var(--text);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(16, 36, 63, .10);
    padding: 28px 26px;
  }
  .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .login-brand .brand-icon {
    width: 34px; height: 34px; border-radius: 8px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .login-title { font-size: 17px; font-weight: 700; color: var(--text); }
  .login-sub { font-size: 12px; color: var(--text-dim); }
  .login-field { margin-bottom: 14px; }
  .login-field label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-dim); margin-bottom: 5px;
  }
  .login-field input {
    width: 100%; padding: 9px 11px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: var(--text);
  }
  .login-field input:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  .login-card .btn.primary { width: 100%; justify-content: center; padding: 10px; font-size: 14px; }
  .login-error {
    display: none; margin-bottom: 14px; padding: 9px 11px;
    background: var(--critical-tint); border: 1px solid var(--critical); border-radius: 7px;
    color: var(--critical); font-size: 13px;
  }
  .login-hint { margin-top: 16px; font-size: 11.5px; color: var(--text-dim); line-height: 1.5; }
  .login-theme-toggle { position: absolute; top: 20px; right: 20px; }
</style>
</head>
<body>
<div class="login-page">
  <button type="button" id="themeToggleBtn" class="theme-toggle login-theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
  </button>
  <form class="login-card" id="loginForm">
    <div class="login-brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="8" rx="1.5"></rect><path d="M3 11v-2a2 2 0 0 1 2-2h5"></path><circle cx="7.5" cy="8.5" r="1"></circle></svg>
      </div>
      <div>
        <div class="login-title">HIS Server</div>
        <div class="login-sub">IV infusion monitoring</div>
      </div>
    </div>

    <div class="login-error" id="loginError"></div>

    <div class="login-field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>

    <div class="login-field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn primary" id="loginBtn">Sign in</button>

    <div class="login-hint">
      Accounts are issued by an administrator. If you forget your password, ask
      them to reset it — there is no recovery email.
    </div>
  </form>
</div>
<script src="js/login.js"></script>
</body>
</html>
